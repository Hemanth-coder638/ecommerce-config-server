server.servlet.context-path=/inventory
server.port=9011

# DB configuration
spring.datasource.url=jdbc:postgresql://${DB_SERVICE:inventory-db-service}:5432/${DB_NAME:inventoryDB}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL data initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

my.variable=order-github-default
features.user-tracking-enabled=false
